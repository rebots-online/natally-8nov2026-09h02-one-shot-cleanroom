<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natally</title>
    <link rel="icon" href="/favicon-32.png" />
    <link rel="preload" as="image" href="/natally-mascot.webp" fetchpriority="high">
    <style>
      /* First paint (ARCHITECTURE §Composition and presence): the atelier
         poster is on screen immediately; React replaces it when the shell
         mounts. */
      html, body { margin: 0; min-height: 100%; background: #171128; }
      #root { min-height: 100dvh; }
      .app-first-paint {
        display: grid;
        place-items: center;
        gap: 14px;
        min-height: 100dvh;
        padding: 24px;
        background: radial-gradient(120% 100% at 50% 0%, #171128 0%, #0d0a17 70%);
        color: #b9a996;
        font: 15px/1.55 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .app-first-paint img {
        width: min(52dvh, 320px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid #6f5a35;
        box-shadow: 0 22px 64px #0007;
      }
      .app-first-paint p { margin: 0; font-style: italic; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-first-paint" aria-hidden="true">
        <img src="/natally-mascot.webp" alt="" width="512" height="512" fetchpriority="high">
        <p>Opening the atelier…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
