<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="origin" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in to Natally</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; color: #fff3d2; background: #120c1c; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #382044, #120c1c 70%); }
      main { width: min(100%, 440px); padding: clamp(24px, 6vw, 40px); border: 1px solid #9e7a35; border-radius: 20px; background: #21132d; box-shadow: 0 20px 70px #0006; }
      h1 { margin-top: 0; color: #ffe084; font-size: 2rem; }
      p { line-height: 1.6; }
      #native-auth-status { min-height: 5em; }
      .actions { display: grid; gap: 14px; margin-top: 24px; }
      button { min-height: 48px; border: 1px solid #e6bd58; border-radius: 10px; padding: 12px 18px; font: inherit; font-size: 1rem; cursor: pointer; background: #ffe084; color: #21132d; }
      button.secondary { background: transparent; color: #ffe084; }
      button:focus-visible { outline: 3px solid #fff3d2; outline-offset: 4px; }
      button:disabled { cursor: default; opacity: .55; }
    </style>
  </head>
  <body>
    <main aria-labelledby="native-auth-title">
      <h1 id="native-auth-title">Sign in to Natally</h1>
      <p>Your Google sign-in takes place in this browser, then returns to the Natally app.</p>
      <p id="native-auth-status" role="status" aria-live="polite">Preparing your sign-in…</p>
      <div class="actions">
        <button id="native-auth-continue" type="button" disabled>Continue with Google</button>
        <button id="native-auth-cancel" class="secondary" type="button" disabled>Cancel sign-in</button>
      </div>
    </main>
    <script type="module" src="/src/platform/nativeAuthPage.ts"></script>
  </body>
</html>
