<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Natally — live atelier master</title>
<style>
    /* -------------------------------------------------------------
       CSS RESET & BASE DESIGN TOKENS (Natally's Live Atelier)
       Colors:
       - Atelier Ink: #130F18 (foundation)
       - Plum Glass: rgba(27, 19, 32, 0.78)
       - Plum Solid: #211824
       - Candle Cream: #F5EAD7 (primary text)
       - Quiet Linen: #C5B7A7 (secondary copy)
       - Aged Brass: #CFAD70 (interface accent)
       - Brass Edge: rgba(207, 173, 112, 0.26)
       - Spoken Light: #FFF36B (active word)
       ------------------------------------------------------------- */
    @font-face {
      font-family: 'Playfair Display';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: local('Playfair Display'), local('PlayfairDisplay-Regular'), serif;
    }
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: local('Outfit'), local('Outfit-Regular'), sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --atelier-ink: #130F18;
      --plum-glass: rgba(27, 19, 32, 0.85);
      --plum-solid: #211824;
      --plum-surface: #1e1521;
      --plum-dark: #160e18;
      --candle-cream: #F5EAD7;
      --quiet-linen: #C5B7A7;
      --aged-brass: #CFAD70;
      --aged-brass-hover: #dfbe82;
      --brass-edge: rgba(207, 173, 112, 0.26);
      --brass-edge-strong: rgba(207, 173, 112, 0.45);
      --spoken-light: #FFF36B;
      --error-red: #E57373;
      --error-bg: rgba(229, 115, 115, 0.12);
      
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--atelier-ink);
      color: var(--candle-cream);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Outer Frame */
    .atelier-viewport {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      background-color: var(--atelier-ink);
    }

    /* HEADER: 52px desktop, 48px phone */
    .atelier-header {
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--brass-edge);
      background-color: var(--atelier-ink);
      z-index: 40;
      flex-shrink: 0;
    }

    .atelier-brand-wordmark {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--candle-cream);
      letter-spacing: -0.01em;
      text-decoration: none;
      user-select: none;
      line-height: 1;
      display: flex;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
    }

    .atelier-header-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .atelier-nav-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--quiet-linen);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 4px;
      transition: color 0.15s ease;
    }
    .atelier-nav-link:hover, .atelier-nav-link.active {
      color: var(--candle-cream);
    }

    .atelier-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .atelier-allowance-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--aged-brass);
      background: rgba(207, 173, 112, 0.1);
      border: 1px solid var(--brass-edge);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .atelier-account-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      color: var(--quiet-linen);
      transition: border-color 0.15s ease;
    }
    .atelier-account-btn:hover, .atelier-account-btn:focus-visible {
      border-color: var(--brass-edge);
      outline: none;
    }
    .atelier-account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--plum-solid);
      border: 1px solid var(--brass-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--candle-cream);
      overflow: hidden;
    }

    .atelier-menu-mobile-btn {
      display: none;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--brass-edge);
      border-radius: 8px;
      color: var(--candle-cream);
      cursor: pointer;
    }

    /* MAIN STAGE + RAIL GRID */
    .atelier-main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 352px;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      align-items: start;
    }

    /* STAGE COLUMN */
    .atelier-stage-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      position: sticky;
      top: 24px;
    }

    .atelier-stage-box {
      position: relative;
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 520px;
      max-height: 820px;
      background-color: #0b080e;
      border-radius: 16px;
      border: 1px solid var(--brass-edge);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Room Container */
    .atelier-room-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 55%, #2a1b2c 0%, #130f18 70%);
    }

    .atelier-room-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      pointer-events: none;
      display: block;
    }

    /* Room fallback visual rendering (SVG canvas in case webp is local) */
    .atelier-room-canvas-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* 3D Chart Inset Slot & Focused Chart */
    .atelier-chart-slot {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Dedicated Chart View inside Stage (when S06-chart-focus is active) */
    .atelier-chart-focused-view {
      position: absolute;
      inset: 20px;
      background: rgba(19, 15, 24, 0.92);
      border: 1px solid var(--brass-edge);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      padding: 24px;
    }
    .atelier-natally-inset-dock {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 140px;
      height: 140px;
      border-radius: 12px;
      border: 1px solid var(--brass-edge-strong);
      overflow: hidden;
      background: #19121e;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .atelier-natally-inset-dock img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    /* Stage Controls Bar */
    .atelier-stage-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .atelier-stage-ctrl-btn {
      height: 40px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(27, 19, 32, 0.75);
      border: 1px solid var(--brass-edge);
      border-radius: 8px;
      color: var(--candle-cream);
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .atelier-stage-ctrl-btn:hover {
      background: var(--plum-solid);
      border-color: var(--aged-brass);
    }

    /* Stage Status Alert */
    .atelier-stage-status-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      max-width: 320px;
    }

    /* CAPTION SLOT: two lines max */
    .atelier-caption-band {
      background: var(--plum-glass);
      border: 1px solid var(--brass-edge);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--candle-cream);
      backdrop-filter: blur(12px);
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .atelier-spoken-word {
      color: var(--spoken-light);
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 243, 107, 0.3);
    }

    /* TASK RAIL COLUMN */
    .atelier-rail-col {
      width: 352px;
      min-width: 352px;
      position: relative;
    }

    .atelier-rail-surface {
      background-color: var(--plum-glass);
      border: 1px solid var(--brass-edge);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px) saturate(125%);
      box-shadow: 0 12px 32px rgba(10, 7, 13, 0.4);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--brass-edge) transparent;
    }

    /* Rail Header Row */
    .atelier-rail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(207, 173, 112, 0.15);
    }
    .atelier-rail-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--candle-cream);
      letter-spacing: -0.01em;
      margin: 0;
    }
    .atelier-rail-btn-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--quiet-linen);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .atelier-rail-btn-icon:hover {
      color: var(--candle-cream);
      border-color: var(--brass-edge);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Typography inside Rail */
    .atelier-body-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--candle-cream);
      margin-bottom: 16px;
      max-width: 55ch;
    }
    .atelier-secondary-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--quiet-linen);
      margin-bottom: 16px;
    }
    .atelier-cost-line {
      font-size: 13px;
      color: var(--quiet-linen);
      margin-top: 10px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* Form Fields & Controls */
    .atelier-field-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .atelier-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--candle-cream);
    }
    .atelier-input {
      height: 48px;
      width: 100%;
      border-radius: 12px;
      background-color: var(--plum-solid);
      border: 1px solid var(--brass-edge);
      color: var(--candle-cream);
      padding: 0 16px;
      font-family: var(--font-body);
      font-size: 16px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .atelier-input:focus {
      border-color: var(--aged-brass);
      box-shadow: 0 0 0 2px rgba(207, 173, 112, 0.35);
    }
    .atelier-input::placeholder {
      color: rgba(197, 183, 167, 0.5);
    }
    .atelier-inline-error {
      font-size: 13px;
      color: var(--error-red);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Buttons */
    .atelier-btn-primary {
      height: 48px;
      width: 100%;
      border-radius: 12px;
      background-color: var(--aged-brass);
      color: var(--atelier-ink);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .atelier-btn-primary:hover {
      background-color: var(--aged-brass-hover);
    }
    .atelier-btn-primary:active {
      transform: scale(0.985);
    }
    .atelier-btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .atelier-btn-secondary {
      height: 48px;
      width: 100%;
      border-radius: 12px;
      background-color: transparent;
      color: var(--candle-cream);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      border: 1px solid var(--brass-edge);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      margin-top: 8px;
    }
    .atelier-btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.04);
      border-color: var(--aged-brass);
    }

    .atelier-btn-text {
      background: none;
      border: none;
      color: var(--quiet-linen);
      font-size: 14px;
      cursor: pointer;
      padding: 8px 4px;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-align: center;
      display: block;
      width: 100%;
      margin-top: 6px;
    }
    .atelier-btn-text:hover {
      color: var(--candle-cream);
    }

    /* Radio Choice Card for Pricing */
    .atelier-choice-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .atelier-choice-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--brass-edge);
      background: var(--plum-solid);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .atelier-choice-label:hover {
      border-color: var(--aged-brass);
    }
    .atelier-choice-label input[type="radio"] {
      accent-color: var(--aged-brass);
      width: 18px;
      height: 18px;
      margin-right: 12px;
    }
    .atelier-choice-price {
      font-weight: 600;
      color: var(--aged-brass);
      font-family: var(--font-mono);
    }

    /* Step indicator for intake */
    .atelier-step-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    .atelier-step-dot {
      height: 4px;
      flex: 1;
      border-radius: 2px;
      background: rgba(207, 173, 112, 0.2);
    }
    .atelier-step-dot.active {
      background: var(--aged-brass);
    }

    /* ReCAPTCHA mock container */
    .atelier-recaptcha-region {
      min-height: 76px;
      background: #17111c;
      border: 1px solid var(--brass-edge);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .atelier-recaptcha-check {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--candle-cream);
    }
    .atelier-recaptcha-check input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--aged-brass);
    }

    /* Progress bar */
    .atelier-progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(207, 173, 112, 0.15);
      overflow: hidden;
      margin: 12px 0;
    }
    .atelier-progress-fill {
      height: 100%;
      background: var(--aged-brass);
      transition: width 0.3s ease;
    }

    /* Transcript region */
    .atelier-transcript-scroll {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid rgba(207, 173, 112, 0.15);
      border-radius: 10px;
      padding: 12px;
      background: rgba(19, 15, 24, 0.5);
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .atelier-msg-bubble-natally {
      color: var(--candle-cream);
      border-left: 2px solid var(--aged-brass);
      padding-left: 10px;
    }
    .atelier-msg-bubble-user {
      color: var(--quiet-linen);
      align-self: flex-end;
      text-align: right;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
    }

    /* Utility Footer inside Rail or bottom */
    .atelier-rail-footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid rgba(207, 173, 112, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--quiet-linen);
    }
    .atelier-rail-footer a {
      color: var(--quiet-linen);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .atelier-rail-footer a:hover {
      color: var(--candle-cream);
      text-decoration: underline;
    }
    .atelier-version-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(197, 183, 167, 0.6);
    }

    /* STATUS NOTIFICATION ACCORDION */
    .atelier-status-banner {
      background: var(--plum-solid);
      border: 1px solid var(--brass-edge);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .atelier-status-banner.error {
      border-color: var(--error-red);
      background: var(--error-bg);
      color: var(--error-red);
    }

    /* Native Handoff Bridge view container (for S10) */
    .atelier-bridge-box {
      border: 1px solid var(--brass-edge);
      border-radius: 12px;
      padding: 16px;
      background: var(--plum-surface);
      margin-bottom: 16px;
    }

    /* -------------------------------------------------------------
       RESPONSIVE BREAKPOINTS (Mobile below 768px)
       Header -> persistent room 240-380px -> caption -> rail
       ------------------------------------------------------------- */
    @media (max-width: 768px) {
      .atelier-header {
        height: 48px;
        padding: 0 16px;
      }
      .atelier-brand-wordmark {
        font-size: 24px;
      }
      .atelier-header-nav {
        display: none;
      }
      .atelier-menu-mobile-btn {
        display: flex;
      }

      .atelier-main-layout {
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 16px;
      }

      .atelier-stage-col {
        position: relative;
        top: 0;
        width: 100%;
      }

      .atelier-stage-box {
        height: 44dvh;
        min-height: 240px;
        max-height: 380px;
      }

      .atelier-rail-col {
        width: 100%;
        min-width: 0;
      }

      .atelier-rail-surface {
        padding: 20px;
        max-height: none;
        overflow: visible;
      }
    }
  </style>
</head>
<body class="atelier-viewport">
<!-- =============================================================
       DATA-SLOT: HEADER (52px desktop / 48px phone)
       Wordmark left, compact nav, account right (32px avatar in 44px)
       ============================================================= -->
<header class="atelier-header" data-slot="header">
<div style="display: flex; align-items: center; gap: 24px;">
<button aria-label="Natally home" class="atelier-brand-wordmark" data-go="S01-guest">Natally</button>
<nav aria-label="Sections" class="atelier-header-nav">
<button class="atelier-nav-link" data-go="S01-meet">Meet Natally</button>
<button class="atelier-nav-link" data-go="S01-chart">Your chart</button>
<button class="atelier-nav-link" data-go="S01-aloud">Reading aloud</button>
<button class="atelier-nav-link" data-go="S01-personal">Personal readings</button>
<button class="atelier-nav-link" data-go="S01-prices">Prices</button>
<button class="atelier-nav-link" data-go="S01-learn">Learn astrology</button>
</nav>
</div>
<div class="atelier-header-actions">
<div class="atelier-allowance-badge" data-bind="allowance" id="atelier-allowance-display" style="display: none;">Checking…</div>
<button aria-label="Account details" class="atelier-account-btn" data-go="S07-account">
<div class="atelier-account-avatar">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>

<!-- =============================================================
       TINY INLINE PROTOTYPE CONTROLLER SCRIPT
       Supports: ?screen=STATE in query, [data-go] clicks,
       switching templates into #atelier-rail-mount without remounting stage
       ============================================================= -->
<script>
    (function() {
      const mount = document.getElementById('atelier-rail-mount');
      const chartFocusEl = document.getElementById('atelier-chart-focused-element');
      const captionEl = document.getElementById('atelier-caption-text');
      const allowanceDisplay = document.getElementById('atelier-allowance-display');

      function getScreenFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('screen') || 'S01-guest';
      }

      function mountScreen(screenId) {
        const template = document.querySelector(`template[data-screen="${screenId}"]`);
        if (!template) {
          console.warn('Unknown screen variant:', screenId);
          return;
        }

        // Mount template content into the rail
        mount.innerHTML = '';
        mount.appendChild(template.content.cloneNode(true));

        // Toggle focused chart view if S06-chart-focus
        if (screenId === 'S06-chart-focus') {
          chartFocusEl.style.display = 'flex';
        } else {
          chartFocusEl.style.display = 'none';
        }

        // Update signed-in allowance badge visibility
        const isSignedIn = ['S03-first-visit', 'S06-reading', 'S06-chart-focus', 'S07-account', 'S08-topup', 'S09-offer', 'S09-retained'].includes(screenId);
        allowanceDisplay.style.display = isSignedIn ? 'block' : 'none';

        // Update captions according to state context
        if (screenId === 'S06-reading' || screenId === 'S06-chart-focus') {
          captionEl.innerHTML = '<span>Natally: <span class="atelier-spoken-word">“Your</span> Sun sits at 22° Pisces, trine to your Scorpio ascendant.”</span>';
        } else if (screenId.startsWith('S04')) {
          captionEl.innerHTML = '<span>Natally: <span class="atelier-spoken-word">“Take</span> your time with your coordinates. Precision gives clarity.”</span>';
        } else if (screenId === 'S05-casting') {
          captionEl.innerHTML = '<span>Natally: <span class="atelier-spoken-word">“The</span> sky is aligning. One moment as I compute your houses.”</span>';
        } else {
          captionEl.innerHTML = '<span>Natally: <span class="atelier-spoken-word">“Welcome</span> into the atelier. Tell me your birth sky when you are ready.”</span>';
        }

        // Scroll rail to top on transition
        mount.scrollTop = 0;
      }

      // Event delegation for state transitions
      document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-go]');
        if (target) {
          e.preventDefault();
          const targetScreen = target.getAttribute('data-go');
          const newUrl = new URL(window.location);
          newUrl.searchParams.set('screen', targetScreen);
          window.history.pushState({ screen: targetScreen }, '', newUrl);
          mountScreen(targetScreen);
        }
      });

      // Handle browser back/forward buttons
      window.addEventListener('popstate', function(e) {
        mountScreen(getScreenFromUrl());
      });

      // Initialize on load
      mountScreen(getScreenFromUrl());

      // Audio toggle handler
      const soundBtn = document.getElementById('ctrl-sound');
      let soundActive = true;
      soundBtn.addEventListener('click', function() {
        soundActive = !soundActive;
        soundBtn.querySelector('span').textContent = soundActive ? 'Sound on' : 'Sound muted';
      });
    })();
  </script>
</body>
