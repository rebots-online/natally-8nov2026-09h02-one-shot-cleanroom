<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#130f18">
  <meta name="natally-version" content="">
  <title>Natally — the live atelier</title>
  <meta name="description" content="Explore Natally’s atelier and your birth chart.">
  <link rel="icon" href="/favicon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" as="image" href="/atelier/room.webp" fetchpriority="high">
  <link rel="stylesheet" href="/src/app/prototype/atelier-frozen.css">
  <style>html,body{margin:0;min-height:100%;background:#130f18}#root{min-height:100dvh}</style>
</head>
<body>
  <div id="root">
    <div class="atelier-viewport" aria-busy="true">
      <header class="atelier-header" data-slot="header"><span class="atelier-brand-wordmark">Natally</span></header>
      <main class="atelier-main-layout">
        <div class="atelier-stage-col">
          <div class="atelier-stage-box" data-slot="stage">
            <div class="atelier-room-container"><img class="atelier-room-img" src="/atelier/room.webp" alt="Natally in her atelier" fetchpriority="high"></div>
            <div class="atelier-stage-status-overlay" data-slot="status"></div>
          </div>
          <div class="atelier-caption-band" data-slot="caption"></div>
        </div>
        <div class="atelier-rail-col" data-slot="rail">
          <div class="atelier-rail-surface"><div class="atelier-rail-header"><h1 class="atelier-rail-title">Signing you in…</h1></div></div>
          <footer class="atelier-rail-footer"><div><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></div><span class="atelier-version-tag"></span></footer>
        </div>
      </main>
    </div>
  </div>
  <noscript><p>Enable JavaScript to explore Natally’s interactive atelier.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
